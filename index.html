<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU Scheduling Visualizer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="main-title">CPU SCHEDULING ALGORITHM VISUALIZER</h1>
        <div class="card">
            <h2>1. Select Algorithm</h2>
            <select id="algorithm-selector">
                <option value="FCFS">First Come First Serve (FCFS)</option>
                <option value="SJF">Shortest Job First (SJF)</option>
                <option value="LJF">Longest Job First (LJF)</option>
                <option value="SRTF">Shortest Remaining Time First (SRTF)</option>
                <option value="LRTF">Longest Remaining Time First (LRTF)</option>
                <option value="PRIO-NP">Priority (Non-Preemptive)</option>
                <option value="PRIO-P">Priority (Preemptive)</option>
                <option value="RR">Round Robin</option>
                <option value="HRRN">Highest Response Ratio Next (HRRN)</option>
            </select>
            <div id="rr-options" class="hidden">
                <label for="time-quantum">Time Quantum:</label>
                <input type="number" id="time-quantum" value="2" min="1">
            </div>
        </div>

        <div class="card">
            <h2>2. Input Processes</h2>
            <table id="process-table">
                <thead>
                    <tr>
                        <th>Process ID</th>
                        <th>Arrival Time (AT)</th>
                        <th>Burst Time (BT)</th>
                        <th id="priority-header" class="hidden">Priority</th>
                        <th>Remove</th>
                    </tr>
                </thead>
                <tbody id="process-table-body">
                    </tbody>
            </table>
            <button id="add-process-btn" class="icon-btn">+</button>
        </div>
        
        <button id="visualize-btn">Visualize</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
